<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="spica-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="spica-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="spica-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: The Spica Binary Star Telemetry Engine -->
  <g transform="translate(45, 20)">
    <!-- Real-time Analytics Bar Chart Vectors (Sovereign Telemetry) -->
    <rect x="25" y="105" width="8" height="35" rx="3" fill="#06B6D4" opacity="0.4" />
    <rect x="38" y="85" width="8" height="55" rx="3" fill="#3B82F6" opacity="0.6" />
    <rect x="51" y="65" width="8" height="75" rx="3" fill="#8B5CF6" opacity="0.8" />

    <!-- Telemetry Frequency Wave (Conversion Funnel Curve) -->
    <path d="M 15,120 Q 55,40 100,85 T 165,60" fill="none" stroke="url(#spica-wave-grad)" stroke-width="3" stroke-dasharray="140 15" />
    
    <!-- Primary Spica Star (Alpha Virginis Primary - Blue-White Giant) -->
    <g transform="translate(100, 85)" filter="url(#spica-glow)">
      <!-- 8-Point Diamond Star -->
      <polygon points="0,-42 11,-14 42,0 11,14 0,42 -11,14 -42,0 -11,-14" fill="url(#spica-primary-grad)" />
      <!-- Brilliant Core -->
      <polygon points="0,-18 5,-6 18,0 5,6 0,18 -5,6 -18,0 -5,-6" fill="#F0FDFA" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Secondary Companion Star (Binary Orbital Partner) -->
    <g transform="translate(142, 60)" filter="url(#spica-glow)">
      <polygon points="0,-22 6,-7 22,0 6,7 0,22 -6,7 -22,0 -6,-7" fill="#06B6D4" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Dual Orbital Arc connecting Binary Pair -->
    <ellipse cx="120" cy="72" rx="35" ry="18" fill="none" stroke="#67E8F9" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-25, 120, 72)" />

    <!-- Pulse Data Nodes (Pageview, Event, Funnel Drop) -->
    <circle cx="20" cy="120" r="4.5" fill="#06B6D4" />
    <circle cx="65" cy="58" r="4" fill="#3B82F6" />
    <circle cx="165" cy="60" r="5" fill="#8B5CF6" />
  </g>

  <!-- Typography: SPICA ANALYTICS -->
  <g transform="translate(240, 105)">
    <!-- Main Brand Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-weight="900" 
          font-size="62" 
          letter-spacing="2" 
          fill="#0F172A">
      SPICA<tspan fill="url(#spica-primary-grad)">ANALYTICS</tspan>
    </text>

    <!-- Enterprise Positioning Subtitle -->
    <text y="38" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-weight="600" 
          font-size="14.5" 
          letter-spacing="4.5" 
          fill="#0284C7">
      PRIVACY-FIRST WEB &amp; PRODUCT TELEMETRY ENGINE
    </text>
  </g>
</svg>
