services:
  - type: web
    name: spica-analytics-web
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /api/heartbeat
    envVars:
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: spica-analytics-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: TRACKER_SCRIPT_NAME
        value: get-analytics
      - key: COLLECT_API_ENDPOINT
        value: /api/send

databases:
  - name: spica-analytics-db
    plan: standard
    region: oregon
    databaseName: spica_production
    user: spica_admin
    postgresMajorVersion: 15
